<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início | Advocacia</title>
  <link rel="icon" type="image/png" href="Favicon.png">
  <style>
    :root {
      --bg-dark: #0f1013;
      --gold-light: #d4af37;
      --text-gray: #a0a6b5;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    p {
      color: var(--text-gray);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-gold {
      display: inline-block;
      padding: 14px 28px;
      border: 1px solid var(--gold-light);
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      background: transparent;
    }
    .btn-gold:hover {
      background: var(--gold-light);
      color: var(--bg-dark);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Início</h1>
    <p>Esta página está em construção. Em breve, novidades por aqui.</p>
    <a href="/direito-trabalhista" class="btn-gold">Área Trabalhista</a>
  </div>
</body>
</html>
