<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | Advocacia</title>
  <link rel="icon" type="image/png" href="/Favicon.png">
  <style>
    :root {
      --bg-dark: #0f1013;
      --bg-card: #181a20;
      --gold: #c5a880;
      --gold-light: #e5cda9;
      --text-main: #ffffff;
      --text-gray: #a0a6b5;
      --border-color: rgba(197, 168, 128, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Background styling matching the landing page */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(197, 168, 128, 0.08) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      right: -100px;
      z-index: 1;
    }
    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(197, 168, 128, 0.05) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      left: -150px;
      z-index: 1;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
      position: relative;
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .logo span {
      color: var(--gold);
    }

    .subtitle {
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .input-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 14px 16px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(197, 168, 128, 0.1);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--gold) 0%, #b3946b 100%);
      color: #0f1013;
      border: none;
      border-radius: 6px;
      padding: 15px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(197, 168, 128, 0.3);
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-box {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15, 16, 19, 0.3);
      border-top-color: #0f1013;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <div class="logo">Painel <span>Admin</span></div>
      <div class="subtitle">Faça login para gerenciar seus leads e triagens</div>
    </div>

    <div class="error-box" id="error-box"></div>

    <form id="login-form">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="admin@escritorio.com.br" autocomplete="email">
      </div>

      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="btn-submit">Entrar</button>
    </form>
  </div>

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hwhepmulknyonkcjpqmk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rC-1Q2S7Nb2eMrT1i9N8tw_-INyUCmT';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('error-box');
    const btnSubmit = document.getElementById('btn-submit');

    // Auto redirect if already authenticated
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    }
    checkSession();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="loading-spinner"></span>Entrando...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error("Erro na autenticação:", err);
        errorBox.textContent = err.message || "Falha na conexão com o servidor de autenticação.";
        errorBox.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'Entrar';
      }
    });
  </script>
</body>
</html>
