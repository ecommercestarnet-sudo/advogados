<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle | Advocacia</title>
  <link rel="icon" type="image/png" href="/Favicon.png">
  <style>
    :root {
      --bg-dark: #0f1013;
      --bg-card: #181a20;
      --bg-header: #14161b;
      --gold: #c5a880;
      --gold-light: #e5cda9;
      --text-main: #ffffff;
      --text-gray: #a0a6b5;
      --border-color: rgba(197, 168, 128, 0.15);
      --success: #2ec4b6;
      --warning: #ff9f1c;
      --danger: #e71d36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0; /* Hidden initially to prevent layout flash during auth check */
      transition: opacity 0.2s ease-in;
    }

    body.authorized {
      opacity: 1;
    }

    /* HEADER */
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--gold) 0%, #b3946b 100%);
      color: #0f1013;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand h1 span {
      color: var(--gold);
      font-weight: 600;
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-email {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .btn-logout {
      background: transparent;
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.2);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 107, 107, 0.1);
      border-color: #ff6b6b;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* SUMMARY CARDS */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }

    /* FILTERS & SEARCH */
    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: var(--gold);
    }

    /* DATA TABLE */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
      min-width: 800px;
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-gray);
      font-weight: 600;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }

    .lead-name-cell {
      font-weight: 500;
      color: #fff;
    }

    /* BADGES */
    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .score-high {
      background: rgba(46, 196, 182, 0.15);
      color: var(--success);
      border-color: rgba(46, 196, 182, 0.2);
    }

    .score-high:hover {
      background: rgba(46, 196, 182, 0.25);
      box-shadow: 0 0 10px rgba(46, 196, 182, 0.2);
    }

    .score-medium {
      background: rgba(255, 159, 28, 0.15);
      color: var(--warning);
      border-color: rgba(255, 159, 28, 0.2);
    }

    .score-medium:hover {
      background: rgba(255, 159, 28, 0.25);
      box-shadow: 0 0 10px rgba(255, 159, 28, 0.2);
    }

    .score-low {
      background: rgba(231, 29, 54, 0.15);
      color: var(--danger);
      border-color: rgba(231, 29, 54, 0.2);
    }

    .score-low:hover {
      background: rgba(231, 29, 54, 0.25);
      box-shadow: 0 0 10px rgba(231, 29, 54, 0.2);
    }

    .wa-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 500;
    }

    .wa-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .date-text {
      color: var(--text-gray);
      font-size: 0.85rem;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      color: var(--text-gray);
    }

    /* MODAL DIAGNÓSTICO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-container {
      transform: translateY(0);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-size: 1.7rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close-btn:hover {
      color: #fff;
    }

    .modal-body {
      padding: 24px;
      line-height: 1.6;
      font-size: 0.95rem;
      color: #e0e6ed;
      white-space: pre-wrap; /* Preserves LLM diagnostic linebreaks */
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
    }

    .btn-close-modal {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-close-modal:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="logo-badge">ADMIN</div>
      <h1>Sua <span>Logo</span></h1>
    </div>
    <div class="user-nav">
      <span class="user-email" id="user-email">...</span>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <!-- SUMMARY BAR -->
    <div class="summary-grid">
      <div class="card">
        <div class="card-title">Total de Leads</div>
        <div class="card-value" id="stat-total">0</div>
      </div>
      <div class="card">
        <div class="card-title">Casos Qualificados</div>
        <div class="card-value" id="stat-qualified">0</div>
      </div>
      <div class="card">
        <div class="card-title">Score Médio</div>
        <div class="card-value" id="stat-average">0.0</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="table-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar por nome ou WhatsApp...">
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table id="leads-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>WhatsApp</th>
            <th>Data de Cadastro</th>
            <th style="text-align: center;">Score (Viabilidade)</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="leads-tbody">
          <tr>
            <td colspan="5" class="no-data">Carregando leads...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- DIAGNOSTIC MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modal-lead-name">Diagnóstico IA</h2>
        <button class="modal-close-btn" id="modal-close-cross">&times;</button>
      </div>
      <div class="modal-body" id="modal-diag-body">
        Nenhum diagnóstico carregado.
      </div>
      <div class="modal-footer">
        <button class="btn-close-modal" id="modal-close-btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hwhepmulknyonkcjpqmk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rC-1Q2S7Nb2eMrT1i9N8tw_-INyUCmT';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allLeads = [];

    // Authenticate routing
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        window.location.href = 'login.html';
      } else {
        document.body.classList.add('authorized');
        document.getElementById('user-email').textContent = session.user.email;
        loadData();
      }
    }

    checkAuth();

    // Sign out handler
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // Load Leads data with Embedded Triagens
    async function loadData() {
      const tbody = document.getElementById('leads-tbody');
      
      try {
        const { data, error } = await supabaseClient
          .from('leads')
          .select('id, nome, whatsapp, data_criacao, score, status_qualificacao, triagens(analise_ia)')
          .order('data_criacao', { ascending: false });

        if (error) throw error;

        allLeads = data || [];
        renderLeads(allLeads);
        calculateStats(allLeads);

      } catch (err) {
        console.error("Erro ao buscar dados:", err);
        tbody.innerHTML = `<tr><td colspan="5" class="no-data" style="color:var(--danger)">Erro ao carregar dados do Supabase. Verifique se o RLS está configurado para leitura do perfil autenticado.</td></tr>`;
      }
    }

    // Format phone numbers safely
    function formatPhone(num) {
      const digits = num.replace(/\D/g, '');
      if (digits.length === 11) {
        return `(${digits.substring(0, 2)}) ${digits.substring(2, 7)}-${digits.substring(7)}`;
      }
      return num;
    }

    // Render table rows
    function renderLeads(leads) {
      const tbody = document.getElementById('leads-tbody');
      
      if (leads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="no-data">Nenhum lead encontrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      
      leads.forEach(lead => {
        const tr = document.createElement('tr');
        
        // Date parsing
        const date = new Date(lead.data_criacao);
        const formattedDate = date.toLocaleDateString('pt-BR') + ' às ' + date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        // Score class classification
        let scoreClass = 'score-low';
        const scoreVal = lead.score !== null ? lead.score : 0;
        if (scoreVal >= 7) {
          scoreClass = 'score-high';
        } else if (scoreVal >= 5) {
          scoreClass = 'score-medium';
        }

        // Retrieve AI analysis
        const diagnosis = (lead.triagens && lead.triagens[0] && lead.triagens[0].analise_ia) 
          ? lead.triagens[0].analise_ia 
          : 'Nenhum diagnóstico gerado pela IA.';

        // Safe WhatsApp link generator
        const rawPhone = lead.whatsapp.replace(/\D/g, '');
        const waLink = `https://wa.me/${rawPhone.startsWith('55') ? rawPhone : '55' + rawPhone}`;

        tr.innerHTML = `
          <td class="lead-name-cell">${escapeHTML(lead.nome)}</td>
          <td>
            <a href="${waLink}" class="wa-link" target="_blank" rel="noopener noreferrer">
              ${formatPhone(escapeHTML(lead.whatsapp))}
            </a>
          </td>
          <td class="date-text">${formattedDate}</td>
          <td style="text-align: center;">
            <span class="score-badge ${scoreClass}" onclick="openModal('${escapeJS(lead.nome)}', '${escapeJS(diagnosis)}')">
              ${scoreVal}/10
            </span>
          </td>
          <td>
            <button class="btn-logout" style="color:var(--gold-light); border-color:var(--border-color);" onclick="openModal('${escapeJS(lead.nome)}', '${escapeJS(diagnosis)}')">
              Ver Diagnóstico
            </button>
          </td>
        `;
        
        tbody.appendChild(tr);
      });
    }

    // Helper functions for safe escaping to prevent XSS
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeJS(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
    }

    // Statistics calculator
    function calculateStats(leads) {
      document.getElementById('stat-total').textContent = leads.length;
      
      const qualified = leads.filter(l => (l.score !== null ? l.score : 0) >= 7).length;
      document.getElementById('stat-qualified').textContent = qualified;

      if (leads.length > 0) {
        const sum = leads.reduce((acc, curr) => acc + (curr.score !== null ? curr.score : 0), 0);
        document.getElementById('stat-average').textContent = (sum / leads.length).toFixed(1);
      } else {
        document.getElementById('stat-average').textContent = '0.0';
      }
    }

    // Filter leads instantly
    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = allLeads.filter(lead => 
        lead.nome.toLowerCase().includes(term) || 
        lead.whatsapp.includes(term)
      );
      renderLeads(filtered);
    });

    // Diagnostic modal actions
    const modal = document.getElementById('modal-overlay');
    
    window.openModal = function(name, diagnosis) {
      document.getElementById('modal-lead-name').innerHTML = `Caso de: <strong style="color:var(--gold)">${escapeHTML(name)}</strong>`;
      document.getElementById('modal-diag-body').textContent = diagnosis;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    document.getElementById('modal-close-cross').addEventListener('click', closeModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
